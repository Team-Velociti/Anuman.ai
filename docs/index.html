<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Anuman.ai - Intelligent Weather Assistant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
                "primary": "#89ceff",
                "primary-container": "#0ea5e9",
                "background": "#F9FAFB",
                "dark-background": "#000000",
                "text-secondary": "#94A3B8",
                "surface": "#FFFFFF",
                "dark-surface": "#131313",
                "surface-container-lowest": "#0e0e0e",
                "on-surface": "#111827",
                "dark-on-surface": "#e2e2e2",
          }
        }
      }
    }
</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        #splash { transition: opacity 0.5s ease, visibility 0.5s; }
        .typewriter h1 { overflow: hidden; border-right: .15em solid #0EA5E9; white-space: nowrap; margin: 0 auto; letter-spacing: .05em; animation: typing 1.33s steps(30, end), blink-caret .75s step-end infinite; }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #0EA5E9; } }
        .fluid-gradient { background: linear-gradient(135deg, #3b82f6, #a855f7); background-size: 200% 200%; animation: fluidGradient 3s ease infinite; }
        @keyframes fluidGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .mic-fab { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .mic-typing-state { transform: translate(80px, 180px) scale(0.1) !important; opacity: 0 !important; pointer-events: none !important; }
        #auth-modal { transition: opacity 0.3s ease, visibility 0.3s; }
        #auth-modal > div { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: scale(0.95); }
        #auth-modal:not(.hidden) > div { transform: scale(1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .mic-active { animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(14, 165, 233, 0); } 100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); } }
</style>
</head>
<body class="bg-background dark:bg-dark-background text-on-surface dark:text-dark-on-surface min-h-screen flex flex-col overflow-hidden selection:bg-primary-container selection:text-white transition-colors duration-300 h-screen">

<!-- Splash Screen -->
<div class="fixed inset-0 z-[100] bg-background dark:bg-dark-background flex items-center justify-center" id="splash">
    <div class="typewriter inline-block"><h1 class="font-display-lg-mobile md:font-display-lg text-primary dark:text-primary-fixed-dim text-4xl font-bold">anuman.ai</h1></div>
</div>

<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-background/80 dark:bg-dark-background/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 transition-colors duration-300">
    <div class="flex justify-between items-center px-4 py-4 w-full max-w-3xl mx-auto h-16">
        <div class="font-bold text-primary text-2xl tracking-tight">anuman.ai</div>
        <div class="flex items-center gap-4">
            <button aria-label="Toggle Theme" class="p-2 rounded-full text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors" id="theme-toggle">
                <span class="material-symbols-outlined dark-icon hidden">dark_mode</span>
                <span class="material-symbols-outlined light-icon">light_mode</span>
            </button>
            <button aria-label="Login" class="p-2 rounded-full text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors flex items-center gap-2" id="login-btn">
                <span class="material-symbols-outlined text-primary hidden" id="user-avatar-icon">face</span>
                <span class="material-symbols-outlined" id="guest-icon">account_circle</span>
                <span class="text-sm hidden md:inline font-medium" id="user-name-display">Guest</span>
            </button>
        </div>
    </div>
</header>

<!-- Main Chat Canvas -->
<main class="flex-1 flex flex-col relative w-full h-full justify-center items-center">
    <div id="chat-messages" class="absolute top-[70px] bottom-0 left-0 right-0 overflow-y-auto hidden flex-col gap-5 p-4 pb-48 w-full max-w-3xl mx-auto z-10 scroll-smooth hide-scrollbar"></div>
    <div class="relative flex justify-center items-center z-20 transition-all duration-500" id="mic-container">
        <div id="mic-aura" class="absolute w-36 h-36 bg-gradient-to-tr from-blue-500 to-purple-500 rounded-full blur-[25px] opacity-30 dark:opacity-40 transition-opacity duration-300"></div>
        <button id="mic-btn" class="mic-fab fluid-gradient relative w-28 h-28 rounded-full text-white shadow-2xl hover:scale-105 active:scale-95 flex items-center justify-center transition-all duration-500">
            <span class="material-symbols-outlined text-[42px]" id="mic-icon">mic</span>
        </button>
    </div>
</main>

<!-- Bottom Input Area -->
<div class="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-background dark:from-dark-background via-background/90 dark:via-dark-background/90 to-transparent pt-8 pb-4 px-4 z-40">
    <div class="w-full max-w-3xl mx-auto flex flex-col items-center gap-4 relative">
        <div id="suggestion-chips" class="grid grid-cols-2 gap-3 justify-center mx-auto opacity-0 w-full max-w-xs transition-opacity duration-300" style="animation: fadeInUp 0.5s ease 2s forwards;">
            <button onclick="sendLocationQuery('Inavalu')" class="px-3 py-2.5 rounded-full bg-surface dark:bg-dark-surface border border-gray-300 dark:border-gray-800 text-on-surface dark:text-dark-on-surface text-sm shadow-sm hover:bg-gray-100 dark:hover:bg-gray-900 transition-colors flex items-center justify-center gap-1.5 font-medium"><span class="material-symbols-outlined text-[16px] text-primary">location_on</span> Inavalu</button>
            <button onclick="sendLocationQuery('VIT-AP')" class="px-3 py-2.5 rounded-full bg-surface dark:bg-dark-surface border border-gray-300 dark:border-gray-800 text-on-surface dark:text-dark-on-surface text-sm shadow-sm hover:bg-gray-100 dark:hover:bg-gray-900 transition-colors flex items-center justify-center gap-1.5 font-medium"><span class="material-symbols-outlined text-[16px] text-primary">location_on</span> VIT-AP</button>
            <button onclick="sendLocationQuery('Vijayawada')" class="px-3 py-2.5 rounded-full bg-surface dark:bg-dark-surface border border-gray-300 dark:border-gray-800 text-on-surface dark:text-dark-on-surface text-sm shadow-sm hover:bg-gray-100 dark:hover:bg-gray-900 transition-colors flex items-center justify-center gap-1.5 font-medium"><span class="material-symbols-outlined text-[16px] text-primary">location_on</span> Vijayawada</button>
            <button onclick="sendLocationQuery('Guntur')" class="px-3 py-2.5 rounded-full bg-surface dark:bg-dark-surface border border-gray-300 dark:border-gray-800 text-on-surface dark:text-dark-on-surface text-sm shadow-sm hover:bg-gray-100 dark:hover:bg-gray-900 transition-colors flex items-center justify-center gap-1.5 font-medium"><span class="material-symbols-outlined text-[16px] text-primary">location_on</span> Guntur</button>
        </div>
        
        <div class="relative w-full flex items-center bg-surface dark:bg-dark-surface border border-gray-300 dark:border-gray-800 rounded-full shadow-lg focus-within:ring-1 focus-within:ring-primary-container transition-all duration-200">
            <input class="w-full bg-transparent border-none focus:ring-0 text-on-surface dark:text-dark-on-surface pl-6 pr-[90px] py-4 rounded-full placeholder-gray-400" id="chat-input" placeholder="Ask Anuman about the weather..." type="text">
            
            <div class="absolute right-2 flex items-center gap-1">
                <button id="small-mic-btn" class="w-10 h-10 flex items-center justify-center rounded-full text-gray-400 hover:text-primary transition-all duration-300">
                    <span class="material-symbols-outlined text-[24px]">mic</span>
                </button>
                <button id="send-btn" class="w-10 h-10 flex items-center justify-center rounded-full text-white bg-primary-container hover:bg-primary transition-all duration-300 opacity-0 scale-50 pointer-events-none hidden">
                    <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">send</span>
                </button>
            </div>
        </div>
        <div class="text-center mt-1"><p class="text-[11px] text-gray-500">Anuman.ai can make mistakes. Consider verifying important information.</p></div>
    </div>
</div>

<!-- Custom Auth Modal (No Firebase) -->
<div class="fixed inset-0 z-[120] bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4" id="auth-modal">
    <div class="bg-surface dark:bg-[#111] rounded-3xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col border border-gray-200 dark:border-gray-800 relative">
        <button class="absolute top-4 right-4 text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800" id="close-modal"><span class="material-symbols-outlined">close</span></button>
        <div class="p-8 pb-4 text-center border-b border-gray-100 dark:border-gray-800">
            <h2 class="text-2xl font-bold text-primary dark:text-primary-fixed-dim" id="auth-title">Welcome</h2>
            <p class="text-gray-500 mt-2 text-sm" id="auth-subtitle">Login or sign up to continue.</p>
            
            <div class="flex justify-center mt-4 border-b border-gray-200 dark:border-gray-700" id="auth-tabs">
                <button id="tab-login" class="px-4 py-2 border-b-2 border-primary text-primary font-medium transition-colors">Log In</button>
                <button id="tab-signup" class="px-4 py-2 border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 transition-colors">Sign Up</button>
            </div>
        </div>
        <div class="p-8 flex flex-col gap-4">
            <div id="signup-fields" class="flex flex-col gap-4 hidden">
                <input id="setup-name" class="w-full bg-transparent border border-gray-300 dark:border-gray-700 focus:ring-1 focus:ring-primary-container rounded-xl px-4 py-3 text-on-surface dark:text-white" placeholder="Full Name" type="text">
                <input id="setup-age" class="w-full bg-transparent border border-gray-300 dark:border-gray-700 focus:ring-1 focus:ring-primary-container rounded-xl px-4 py-3 text-on-surface dark:text-white" placeholder="Age" type="number">
            </div>
            <input id="setup-email" class="w-full bg-transparent border border-gray-300 dark:border-gray-700 focus:ring-1 focus:ring-primary-container rounded-xl px-4 py-3 text-on-surface dark:text-white" placeholder="Email address" type="email" required>
            <button id="save-profile-btn" class="w-full bg-primary-container text-white text-base rounded-xl py-3 hover:bg-primary transition-colors font-semibold shadow-md shadow-primary-container/20 mt-2">Log In</button>
            <button id="view-history-btn" class="w-full bg-gray-100 dark:bg-gray-800 text-on-surface dark:text-white text-base rounded-xl py-3 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors font-semibold hidden mt-2">View History</button>
            <button id="logout-btn" class="w-full bg-red-500/10 text-red-500 text-base rounded-xl py-3 hover:bg-red-500/20 transition-colors font-semibold hidden mt-2">Log Out</button>
        </div>
    </div>
</div>

<!-- History Modal -->
<div class="fixed inset-0 z-[130] bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4" id="history-modal">
    <div class="bg-surface dark:bg-[#111] rounded-3xl shadow-2xl w-full max-w-md h-[80vh] overflow-hidden flex flex-col border border-gray-200 dark:border-gray-800 relative">
        <div class="p-4 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center">
            <h2 class="text-xl font-bold text-primary">Chat History</h2>
            <button class="text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800" id="close-history-modal"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div id="history-content" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
            <!-- Messages go here -->
        </div>
    </div>
</div>

<script>
    const API_BASE = "https://anuman-ai.onrender.com";
    let isChatActive = false; 
    let currentUserSessionId = "guest_session_" + Math.random().toString(36).substring(7);
    let wasLastInputVoice = false; // <--- Naya flag voice trigger check karne ke liye

    document.addEventListener('DOMContentLoaded', () => {
        const splash = document.getElementById('splash');
        setTimeout(() => { splash.style.opacity = '0'; splash.style.visibility = 'hidden'; }, 3000); 

        const themeToggleBtn = document.getElementById('theme-toggle');
        const html = document.documentElement;
        themeToggleBtn.addEventListener('click', () => {
            html.classList.toggle('dark');
            themeToggleBtn.querySelector('.dark-icon').classList.toggle('hidden');
            themeToggleBtn.querySelector('.light-icon').classList.toggle('hidden');
        });

        const chatInput = document.getElementById('chat-input');
        const micBtn = document.getElementById('mic-btn');
        const micAura = document.getElementById('mic-aura'); 
        const micContainer = document.getElementById('mic-container');
        const sendBtn = document.getElementById('send-btn');
        const smallMicBtn = document.getElementById('small-mic-btn');
        const chatMessages = document.getElementById('chat-messages');
        const suggestionChips = document.getElementById('suggestion-chips');

        // --- CUSTOM LOCAL AUTH LOGIC ---
        const authModal = document.getElementById('auth-modal');
        const nameDisplay = document.getElementById('user-name-display');
        const guestIcon = document.getElementById('guest-icon');
        const userAvatarIcon = document.getElementById('user-avatar-icon');
        const nameInput = document.getElementById('setup-name');
        const emailInput = document.getElementById('setup-email');
        const ageInput = document.getElementById('setup-age');
        const logoutBtn = document.getElementById('logout-btn');
        const saveProfileBtn = document.getElementById('save-profile-btn');
        
        let authMode = 'login';
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const signupFields = document.getElementById('signup-fields');
        const viewHistoryBtn = document.getElementById('view-history-btn');
        const historyModal = document.getElementById('history-modal');
        const closeHistoryModal = document.getElementById('close-history-modal');
        const historyContent = document.getElementById('history-content');
        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');
        const authTabs = document.getElementById('auth-tabs');

        function toggleModal() { authModal.classList.toggle('hidden'); }
        
        document.getElementById('login-btn').addEventListener('click', toggleModal);
        document.getElementById('close-modal').addEventListener('click', toggleModal);
        
        tabLogin.addEventListener('click', () => {
            authMode = 'login';
            tabLogin.classList.add('border-primary', 'text-primary');
            tabLogin.classList.remove('border-transparent', 'text-gray-500', 'dark:text-gray-300');
            tabSignup.classList.remove('border-primary', 'text-primary');
            tabSignup.classList.add('border-transparent', 'text-gray-500', 'dark:text-gray-300');
            signupFields.classList.add('hidden');
            saveProfileBtn.innerText = "Log In";
        });

        tabSignup.addEventListener('click', () => {
            authMode = 'signup';
            tabSignup.classList.add('border-primary', 'text-primary');
            tabSignup.classList.remove('border-transparent', 'text-gray-500', 'dark:text-gray-300');
            tabLogin.classList.remove('border-primary', 'text-primary');
            tabLogin.classList.add('border-transparent', 'text-gray-500', 'dark:text-gray-300');
            signupFields.classList.remove('hidden');
            saveProfileBtn.innerText = "Sign Up";
        });

        function loadSession() {
            const savedEmail = localStorage.getItem('anuman_email');
            const savedSession = localStorage.getItem('anuman_session_id');
            const savedName = localStorage.getItem('anuman_name') || 'User';
            if(savedEmail && savedSession) {
                currentUserSessionId = savedSession;
                nameDisplay.innerText = savedName.split(" ")[0];
                guestIcon.classList.add('hidden');
                userAvatarIcon.classList.remove('hidden');
                
                emailInput.value = savedEmail;
                nameInput.value = savedName === 'User' ? '' : savedName;
                ageInput.value = localStorage.getItem('anuman_age') || "";
                
                logoutBtn.classList.remove('hidden');
                viewHistoryBtn.classList.remove('hidden');
                saveProfileBtn.innerText = "Update Details";
                authTabs.classList.add('hidden');
                signupFields.classList.remove('hidden');
                authTitle.innerText = "Your Profile";
                authSubtitle.innerText = "Manage your account.";
            } else {
                currentUserSessionId = "guest_session_" + Math.random().toString(36).substring(7);
                nameDisplay.innerText = "Guest";
                guestIcon.classList.remove('hidden');
                userAvatarIcon.classList.add('hidden');
                
                logoutBtn.classList.add('hidden');
                viewHistoryBtn.classList.add('hidden');
                saveProfileBtn.innerText = authMode === 'login' ? "Log In" : "Sign Up";
                authTabs.classList.remove('hidden');
                if (authMode === 'login') signupFields.classList.add('hidden');
                else signupFields.classList.remove('hidden');
                authTitle.innerText = "Welcome";
                authSubtitle.innerText = "Login or sign up to continue.";
            }
        }
        loadSession();

        saveProfileBtn.addEventListener('click', () => {
            const isLoggedIn = localStorage.getItem('anuman_session_id');
            if (!isLoggedIn) {
                if (authMode === 'signup') {
                    if(!nameInput.value || !emailInput.value || !ageInput.value) {
                        alert("Please fill all fields.");
                        return;
                    }
                    const newSessionId = "user_" + btoa(emailInput.value).replace(/=/g, '').substring(0, 15);
                    localStorage.setItem('anuman_name', nameInput.value);
                    localStorage.setItem('anuman_email', emailInput.value);
                    localStorage.setItem('anuman_age', ageInput.value);
                    localStorage.setItem('anuman_session_id', newSessionId);
                } else {
                    if(!emailInput.value) {
                        alert("Please enter your email.");
                        return;
                    }
                    const existingSessionId = "user_" + btoa(emailInput.value).replace(/=/g, '').substring(0, 15);
                    localStorage.setItem('anuman_email', emailInput.value);
                    localStorage.setItem('anuman_session_id', existingSessionId);
                    localStorage.setItem('anuman_name', localStorage.getItem('anuman_name') || 'User'); 
                }
            } else {
                // Updating details
                if(!nameInput.value || !emailInput.value) {
                    alert("Name and email cannot be empty.");
                    return;
                }
                localStorage.setItem('anuman_name', nameInput.value);
                localStorage.setItem('anuman_email', emailInput.value);
                localStorage.setItem('anuman_age', ageInput.value);
            }
            loadSession();
            toggleModal();
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.clear();
            nameInput.value = '';
            emailInput.value = '';
            ageInput.value = '';
            // Reset to login mode
            authMode = 'login';
            tabLogin.classList.add('border-primary', 'text-primary');
            tabLogin.classList.remove('border-transparent', 'text-gray-500', 'dark:text-gray-300');
            tabSignup.classList.remove('border-primary', 'text-primary');
            tabSignup.classList.add('border-transparent', 'text-gray-500', 'dark:text-gray-300');
            loadSession();
            toggleModal();
        });
        
        viewHistoryBtn.addEventListener('click', async () => {
            if (!currentUserSessionId.startsWith('user_')) return;
            
            viewHistoryBtn.innerHTML = "Loading...";
            try {
                const res = await fetch(`${API_BASE}/api/history/${currentUserSessionId}`);
                const data = await res.json();
                
                historyContent.innerHTML = '';
                if (data.history && data.history.length > 0) {
                    data.history.forEach(msg => {
                        const role = msg.role;
                        // For user, parts might be array of dict or string. Assuming it's the standard Gemini format
                        // Database stores it as: {'role': 'user', 'parts': [user_prompt]}
                        const text = msg.parts[0];
                        const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
                        const msgDiv = document.createElement('div');
                        msgDiv.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;
                        msgDiv.innerHTML = `<div class="max-w-[85%] md:max-w-[75%] rounded-2xl px-5 py-3 shadow-sm ${role === 'user' ? 'bg-primary-container text-white rounded-br-sm' : 'bg-surface dark:bg-dark-surface border border-gray-200 dark:border-gray-800 text-on-surface dark:text-dark-on-surface rounded-bl-sm'}"><p class="text-[13px] leading-relaxed font-medium">${formattedText}</p></div>`;
                        historyContent.appendChild(msgDiv);
                    });
                } else {
                    historyContent.innerHTML = '<p class="text-center text-gray-500">No history found.</p>';
                }
                historyModal.classList.remove('hidden');
            } catch(e) {
                console.error(e);
                alert("Failed to load history.");
            }
            viewHistoryBtn.innerHTML = "View History";
        });
        
        closeHistoryModal.addEventListener('click', () => {
            historyModal.classList.add('hidden');
        });

        // --- SPEECH RECOGNITION LOGIC ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let isListening = false;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-IN'; 

            const handleMicClick = (e) => {
                e.preventDefault();
                if (isListening) {
                    recognition.stop();
                    return;
                }
                try {
                    recognition.start();
                    isListening = true;
                    chatInput.placeholder = "Listening...";
                    micBtn.classList.add('mic-active');
                    smallMicBtn.classList.add('text-primary');
                    smallMicBtn.classList.add('animate-pulse');
                } catch(err) {
                    console.log("Mic is already starting...", err);
                }
            };

            micBtn.addEventListener('click', handleMicClick);
            smallMicBtn.addEventListener('click', handleMicClick);

            recognition.onresult = (event) => {
                chatInput.value = event.results[0][0].transcript;
                wasLastInputVoice = true; // <--- Set flag ki input voice se aaya hai
                chatInput.dispatchEvent(new Event('input')); 
                resetMicUI();
                
                // Immediately submit text if there is any
                if (chatInput.value.trim().length > 0) {
                    setTimeout(() => sendBtn.click(), 100);
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech error:", event.error);
                resetMicUI("Try typing instead...");
            };

            recognition.onend = () => {
                isListening = false;
                resetMicUI();
            };

            function resetMicUI(placeholder = "Ask Anuman about the weather...") {
                isListening = false;
                chatInput.placeholder = placeholder;
                micBtn.classList.remove('mic-active');
                smallMicBtn.classList.remove('text-primary');
                smallMicBtn.classList.remove('animate-pulse');
            }
        } else {
            smallMicBtn.style.display = 'none';
        }

        // --- UI INPUT & CHAT LOGIC ---
        
        // Agar keyboard se type kiya, toh voice trigger off kardo
        chatInput.addEventListener('keydown', () => {
            wasLastInputVoice = false;
        });

        chatInput.addEventListener('input', (e) => {
            if (e.target.value.trim().length > 0) {
                if (!isChatActive) {
                    micBtn.classList.add('mic-typing-state');
                    micBtn.classList.remove('fluid-gradient');
                    if (micAura) micAura.style.opacity = '0'; 
                }
                setTimeout(() => {
                    sendBtn.classList.remove('hidden');
                    sendBtn.style.opacity = '1'; 
                    sendBtn.style.transform = 'scale(1)'; 
                    sendBtn.style.pointerEvents = 'auto';
                }, 150);
            } else {
                sendBtn.style.opacity = '0'; 
                sendBtn.style.transform = 'scale(0.5)'; 
                sendBtn.style.pointerEvents = 'none';
                
                setTimeout(() => {
                    sendBtn.classList.add('hidden');
                    if (!isChatActive) {
                        micBtn.classList.remove('mic-typing-state');
                        micBtn.classList.add('fluid-gradient');
                        if (micAura) micAura.style.opacity = '0.3'; 
                    }
                }, 150);
            }
        });

        function appendMessage(role, text) {
            if (!isChatActive) {
                isChatActive = true;
                micContainer.style.display = 'none';
                suggestionChips.style.display = 'none';
                chatMessages.classList.remove('hidden');
                chatMessages.classList.add('flex');
            }
            const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            msgDiv.style.animation = 'fadeInUp 0.4s ease forwards';
            msgDiv.innerHTML = `<div class="max-w-[85%] md:max-w-[75%] rounded-2xl px-5 py-3 shadow-sm ${role === 'user' ? 'bg-primary-container text-white rounded-br-sm' : 'bg-surface dark:bg-dark-surface border border-gray-200 dark:border-gray-800 text-on-surface dark:text-dark-on-surface rounded-bl-sm'}"><p class="text-[15px] leading-relaxed font-medium">${formattedText}</p></div>`;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', async () => {
            const query = chatInput.value.trim();
            if(!query) return;
            appendMessage('user', query);
            
            // Backup flag value before clearing input
            const isVoiceQuery = wasLastInputVoice;
            
            chatInput.value = ''; 
            chatInput.dispatchEvent(new Event('input')); 
            wasLastInputVoice = false; // Reset for next message
            
            sendBtn.classList.remove('hidden');
            sendBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>';
            sendBtn.style.opacity = '1'; sendBtn.style.transform = 'scale(1)'; sendBtn.style.pointerEvents = 'none';

            try {
                const res = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: query, 
                        session_id: currentUserSessionId,
                        is_voice: isVoiceQuery // <--- Backend ko bhej diya
                    }) 
                });
                const data = await res.json();
                if (data.reply) {
                    appendMessage('ai', data.reply);
                    
                    // Agar backend ne audio bheja, toh usko turant play karo
                    if (data.audio_base64) {
                        try {
                            const audio = new Audio("data:audio/wav;base64," + data.audio_base64);
                            audio.play();
                        } catch(err) {
                            console.error("Audio playback failed", err);
                        }
                    }
                } else {
                    appendMessage('ai', "Sorry, I received an invalid response format.");
                }
            } catch(e) { appendMessage('ai', "Connection error: Server is waking up, please wait a minute and try again."); }
            
            sendBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: \'FILL\' 1;">send</span>';
            chatInput.dispatchEvent(new Event('input')); 
        });

        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendBtn.click(); } });
    });

    async function sendLocationQuery(loc) {
        const chatInput = document.getElementById('chat-input');
        chatInput.value = `What is the weather in ${loc}?`;
        wasLastInputVoice = false; // Chip pe click karna is not voice
        chatInput.dispatchEvent(new Event('input'));
        setTimeout(() => { document.getElementById('send-btn').click(); }, 100);
    }
</script>
</body>
</html>
